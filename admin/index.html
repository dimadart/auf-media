<style>

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }

  // Import a prepared list: only known fields are taken, links must be http(s), people already in the list are skipped.
  function importPeople() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var arr; try { arr = JSON.parse(r.result); } catch (e) { return toast('Файл не читается: это не JSON'); }
        if (!Array.isArray(arr)) return toast('В файле нет списка контактов');
        var str = function (v, n) { return typeof v === 'string' ? v.trim().slice(0, n) : ''; }, have = {}, added = 0, skipped = 0;
        state.contacts.forEach(function (c) { have[c.name.toLowerCase()] = 1; });
        arr.forEach(function (x) {
          var name = x && str(x.name, 120); if (!name) return;
          if (have[name.toLowerCase()]) { skipped++; return; }
          have[name.toLowerCase()] = 1; added++;
          state.contacts.push({ id: uid(), name: name, en: str(x.name_en, 120), cat: str(x.cat, 40), who: str(x.who, 300), city: str(x.city, 80), status: PSTAT[0], email: '', phone: '', notes: '', by: state.me, added: TODAY, check: str(x.check, 600),
            accs: (Array.isArray(x.accs) ? x.accs : []).filter(function (a) { return a && NETS.indexOf(a.net) > -1 && typeof a.val === 'string' && okUrl(a.val.trim()); }).slice(0, 12).map(function (a) { return { net: a.net, val: a.val.trim().slice(0, 300) }; }),
            sources: (Array.isArray(x.sources) ? x.sources : []).filter(function (u) { return typeof u === 'string' && okUrl(u.trim()); }).slice(0, 6).map(function (u) { return u.trim().slice(0, 400); }) });
        });
        var ok = save(); render();
        toast(!ok ? 'Не сохранено: в браузере кончилось место' : 'Добавлено: ' + added + (skipped ? ', уже были в списке: ' + skipped : ''));
      };
      r.readAsText(f);
    };
    inp.click();
  }

    var r = selRange(), b = r && topBlock(r.startContainer);

      if (special && !b.textContent.trim()) { event.preventDefault(); return document.execCommand('formatBlock', false, 'p'); }
      if (special && atEdge(r, b, true)) { event.preventDefault(); var p = document.createElement('p'); p.innerHTML = '<br>'; edBody.insertBefore(p, b.nextSibling); caret(p); return edDirty(); }
    }

  });
  edBody.addEventListener('paste', function (event) {

  });
  edBody.addEventListener('drop', function (event) {

    event.preventDefault(); if (file && edCan) { edRange = null; addFile(file); }
  });
  edBody.addEventListener('click', function (event) {
    var x = event.target.closest('.x');
    if (x) { var f = x.closest('figure'), n = f.nextElementSibling; f.remove(); if (!edBody.firstChild) edBody.innerHTML = '<p><br></p>'; if (n) caret(n); edDirty(); return; }
    if (event.target.closest('a') && (event.metaKey || event.ctrlKey || !edCan)) window.open(event.target.closest('a').href, '_blank', 'noopener');
  });
  edEl.addEventListener('click', function (event) {

  });
  addEventListener('pagehide', function () { if (edCard) edFlush(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && edCard) edFlush(); });

  // ---------- live collaboration ----------
  // Transport in the prototype is BroadcastChannel: it connects windows of one browser.
  // The messages (here / hello / full / ops) are the same ones a shared realtime channel would carry.
  var peers = {}, chan = null, edSent = { order: [], html: {}, title: '', lede: '' }, edWantFull = false, peerRaf = 0, hereRaf = 0;
  var edPeers = document.getElementById('edpeers'), edWho = document.getElementById('edwho');
  var IDRE = /^[a-z0-9]{4,12}$/;
  try { chan = new BroadcastChannel('auf-admin-collab'); } catch (e) {}
  function post(m) { if (!chan) return; m.tab = tab.id; try { chan.postMessage(m); } catch (e) {} }
  function myName() { return role() === 'owner' ? mname(state.me) : ROLES.filter(function (x) { return x.id === role(); })[0].name; }
  function byId(id) { return IDRE.test(id) ? edBody.querySelector(':scope > [data-id="' + id + '"]') : null; }
  function ensureIds() {
    var seen = {};
    [].forEach.call(edBody.children, function (el) {
      var id = el.getAttribute('data-id');
      if (!id || seen[id] || !IDRE.test(id)) { id = uid(); el.setAttribute('data-id', id); }
      seen[id] = 1;
    });
  }
  function snapshot() {
    var o = { order: [], html: {}, title: edTitle.value, lede: edLede.value };
    [].forEach.call(edBody.children, function (el) { var id = el.getAttribute('data-id'); o.order.push(id); o.html[id] = blockOf(el, true); });
    return o;
  }
  function resetSent() { ensureIds(); edSent = snapshot(); }
  function make(html) { var a = document.createElement('template'); a.innerHTML = String(html); var b = document.createElement('template'); b.innerHTML = serialize(a.content, true); return b.content.firstElementChild; }
  function textOff(el, node, off) { var r = document.createRange(); r.selectNodeContents(el); try { r.setEnd(node, off); } catch (e) { return 0; } return r.toString().length; }
  function locate(el, n) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t, last = null;
    while ((t = w.nextNode())) { if (n <= t.nodeValue.length) return [t, n]; n -= t.nodeValue.length; last = t; }
    return last ? [last, last.nodeValue.length] : [el, 0];
  }
  function myCaret() {
    var a = document.activeElement;
    if (a === edTitle || a === edLede) return { f: a === edTitle ? 'title' : 'lede' };
    var r = selRange(), b = r && topBlock(r.startContainer), id = b && b.getAttribute && b.getAttribute('data-id');
    if (!id) return null;
    return { id: id, s: textOff(b, r.startContainer, r.startOffset), e: topBlock(r.endContainer) === b ? textOff(b, r.endContainer, r.endOffset) : b.textContent.length };
  }
  function sendHere() { hereRaf = 0; post({ t: 'here', card: edCard ? edCard.id : null, name: myName(), color: tab.color, caret: edCard ? myCaret() : null }); }
  function queueHere() { if (!hereRaf) hereRaf = setTimeout(sendHere, 40); }
  function queuePeers() { if (!peerRaf) peerRaf = setTimeout(drawPeers, 16); }

  function syncOut() {
    if (!edCard || !edCan) return;
    ensureIds();
    var now = snapshot(), ops = [], blocks = {}, m = { t: 'ops', card: edCard.id }, any = false;
    now.order.forEach(function (id, i) { if (!(id in edSent.html)) ops.push({ ins: id, after: i ? now.order[i - 1] : null }); if (edSent.html[id] !== now.html[id]) { blocks[id] = now.html[id]; any = true; } });
    edSent.order.forEach(function (id) { if (!(id in now.html)) ops.push({ del: id }); });
    if (now.title !== edSent.title) { m.title = now.title; any = true; }
    if (now.lede !== edSent.lede) { m.lede = now.lede; any = true; }
    edSent = now;
    if (!any && !ops.length) return;
    m.ops = ops; m.blocks = blocks; post(m); queuePeers();
  }
  function setField(el, v) { if (typeof v !== 'string' || el.value === v) return; var s = el.selectionStart, focused = document.activeElement === el; el.value = v; if (focused) try { el.setSelectionRange(s, s); } catch (e) {} grow(el); }
  function applyOps(m) {
    if (!Array.isArray(m.ops) || !m.blocks || typeof m.blocks !== 'object') return;
    var r = selRange(), ab = r && topBlock(r.startContainer), aid = ab && ab.getAttribute && ab.getAttribute('data-id'), keep = aid ? myCaret() : null, done = {};
    m.ops.forEach(function (op) { if (op && op.del) { var el = byId(op.del); if (el) el.remove(); } });
    m.ops.forEach(function (op) {
      if (!op || !op.ins || !IDRE.test(op.ins) || byId(op.ins) || !m.blocks[op.ins]) return;
      var el = make(m.blocks[op.ins]); if (!el) return;
      el.setAttribute('data-id', op.ins);

    Object.keys(m.blocks).forEach(function (id) {
      if (done[id]) return;

    decorate(); edSent = (ensureIds(), snapshot());

      var mine = byId(keep.id);

  }
  function applyFull(m) {
    var tpl = document.createElement('template'); tpl.innerHTML = String(m.html || '');

    setField(edTitle, m.title); setField(edLede, m.lede);
    decorate(); resetSent(); edStats(); queuePeers();
  }
  function collabOpen() { resetSent(); edWantFull = true; post({ t: 'hello', card: edCard.id }); sendHere(); setTimeout(function () { edWantFull = false; }, 1500); queuePeers(); }
  function peerDots(id) {
    var on = Object.keys(peers).filter(function (k) { return peers[k].card === id; });
    return on.length ? '<span class="dots" title="Сейчас в тексте: ' + esc(on.map(function (k) { return peers[k].name; }).join(', ')) + '">' + on.map(function (k) { return '<i style="background:' + peers[k].color + '"></i>'; }).join('') + 'в тексте</span>' : '';
  }
  function peersChanged(moved) { queuePeers(); if (moved && !edCard && !dlg.open) render(); }
  function drawPeers() {
    peerRaf = 0; var html = '', chips = '';
    if (edCard) Object.keys(peers).forEach(function (k) {
      var p = peers[k]; if (p.card !== edCard.id) return;
      chips += '<span style="background:' + p.color + '">' + esc(p.name) + '</span>';

      if (c.f) { var fr = (c.f === 'title' ? edTitle : edLede).getBoundingClientRect(); x = fr.left - 12; y = fr.top + 2; h = Math.min(fr.height - 4, 40); }
      else {

        if (last) { x = last.right; y = last.top; h = last.height; } else { var br = el.getBoundingClientRect(); x = br.left; y = br.top; h = Math.min(br.height, 30); }
      }
      html += '<i class="car" style="left:' + x + 'px;top:' + y + 'px;height:' + h + 'px;background:' + p.color + '"><b style="background:' + p.color + '">' + esc(p.name) + '</b></i>';
    });

  }
  if (chan) chan.onmessage = function (ev) {
    var m = ev.data; if (!m || typeof m !== 'object' || typeof m.tab !== 'string') return;
    if (m.tab === tab.id) { tab.id = uid(); save(); return sendHere(); }
    if (m.t === 'bye') { if (peers[m.tab]) { delete peers[m.tab]; peersChanged(true); } return; }
    if (m.t === 'here') {
      var old = peers[m.tab], moved = !old || old.card !== m.card || old.name !== m.name;
      peers[m.tab] = { card: typeof m.card === 'string' ? m.card : null, name: String(m.name || '').slice(0, 40), color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : '#ff3d8b', caret: m.caret, at: Date.now() };
      peersChanged(moved); if (!old) sendHere(); return;

    if (!edCard || m.card !== edCard.id) return;

    sendHere(); var gone = false, t = Date.now();

    if (gone) peersChanged(true);

  document.addEventListener('selectionchange', function () { if (edCard) queueHere(); });
  [edTitle, edLede].forEach(function (el) { el.addEventListener('focus', queueHere); el.addEventListener('blur', queueHere); });

  addEventListener('resize', queuePeers);
  addEventListener('pagehide', function () { post({ t: 'bye' }); });
  addEventListener('storage', function (e) {
    if (e.key !== KEY || !e.newValue) return;
    var s; try { s = JSON.parse(e.newValue); } catch (x) { return; }
    if (!s || s.v !== 1 || !Array.isArray(s.cards) || !Array.isArray(s.team)) return;
    state.team = s.team; state.cards = s.cards; state.subs = s.subs || []; state.apps = s.apps || []; state.tasks = s.tasks || []; state.contacts = s.contacts || []; state.me = s.me;

    h.push({ at: Date.now(), title: c.title, lede: c.lede || '', body: body });
    var size = function () { return h.reduce(function (n, v) { return n + v.body.length; }, 0); };
    while (h.length > 8 || h.length > 1 && size() > 1500000) h.shift();
  }
  function openHist() {
    edFlush();
    var h = (edCard.hist || []).slice().reverse();
    dlgbody.innerHTML = '<h2>Версии текста</h2>' + (h.length ? '<ul class="list">' + h.map(function (v, i) {
      return '<li><span><b>' + new Date(v.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + '</b> · ' + nfmt(countWords(v.body)) + ' сл.<br><span style="color:var(--mute)">' + esc(v.title) + '</span></span>' + (edCan ? '<button type="button" class="btn ghost" data-restore="' + (edCard.hist.length - 1 - i) + '">Вернуть</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="empty">Версий пока нет. Копия делается при открытии текста и дальше раз в три минуты, пока вы пишете.</p>')
      + '<p class="note">Хранится до восьми последних копий. Текущий текст перед возвратом тоже сохраняется как версия.</p><div class="actions"><span></span><button type="button" class="btn ghost" id="histclose">Закрыть</button></div>';

  }
  dlgbody.addEventListener('click', function (event) {
    var b = event.target.closest('[data-restore]'); if (!b || !edCard || !edCan) return;

    toast('Версия возвращена');
  });


  render();
})();
