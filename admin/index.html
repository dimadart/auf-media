<title>AUF MEDIA — редакция</title>
<style>
@font-face { font-family: Unbounded; font-weight: 300 900; font-display: swap; src: url(../assets/editorial/fonts/unbounded-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Unbounded; font-weight: 300 900; font-display: swap; src: url(../assets/editorial/fonts/unbounded-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2191, U+2193; }
:root { --bg: #0b0b0b; --panel: #151515; --line: #2c2c2c; --text: #f2f0ec; --mute: #9b9792; --yellow: #fdfd38; --pink: #ff3d8b; --blue: #4d63ff; --green: #5ed29a;
  --side: #000; --field: #000; --fline: #6a6a6a; --card: #000; --cline: #333; --hover: #1c1c1c; --chip: #2a2a2a; --ghost: #555; --dim: #7a7a7a; --out: #0e0e0e; --link: #fdfd38; --focus: #fdfd38; --warn: #ff7aa9; --warnline: #6b2a44; --part: #fdfd38; --ok: #5ed29a; --dlg: #101010; --dlgline: #666; --inv: #fff; --inv-text: #000; --mark: #fdfd38; color-scheme: dark; }
:root[data-theme=light] { --bg: #f4f2ee; --panel: #fff; --line: #dedad3; --text: #141414; --mute: #6b6762;
  --side: #fff; --field: #fff; --fline: #8d8881; --card: #fff; --cline: #d5d0c8; --hover: #f0ede7; --chip: #e9e5de; --ghost: #8d8881; --dim: #8d8881; --out: #ebe8e2; --link: #1d2fd6; --focus: #141414; --warn: #c2114f; --warnline: #e7a5bf; --part: #7a6200; --ok: #12804a; --dlg: #fff; --dlgline: #141414; --inv: #141414; --inv-text: #fff; --mark: #141414; color-scheme: light; }
:root[data-theme=light] .logo img { filter: invert(1); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, .u { font-family: Unbounded, 'Arial Black', Arial, sans-serif; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
h1 { font-size: 20px; font-weight: 800; }
h2 { font-size: 13px; font-weight: 800; }
h3 { font-size: 11px; font-weight: 700; color: var(--mute); }
a { color: var(--link); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--side); }
.logo { display: flex; align-items: center; gap: 10px; margin: 0 6px 18px; font-size: 13px; font-weight: 800; }
.logo img { width: 34px; height: auto; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; white-space: nowrap; border: 0; background: none; text-align: left; font: 700 11px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); cursor: pointer; }
nav button:hover { color: var(--text); }
nav button[aria-current=page] { background: var(--yellow); color: #000; }
nav button i { font-style: normal; font-size: 10px; opacity: .8; }
aside .foot { margin-top: auto; font-size: 12px; color: var(--mute); padding: 0 6px; }
main { min-width: 0; padding: 0 26px 60px; }
.proto { margin: 0 -26px; padding: 8px 26px; background: var(--pink); color: #000; font-size: 12.5px; font-weight: 700; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 20px 0 18px; }
.as { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
select, input[type=text], input[type=email], input[type=date], input[type=search], textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--fline); border-radius: 0; background: var(--field); color: var(--text); outline: 0; }
select:focus-visible, input:focus-visible, textarea:focus-visible { border-color: var(--focus); outline: 2px solid var(--focus); outline-offset: 1px; }
select:disabled, input:disabled, textarea:disabled { background: none; border-color: var(--line); color: var(--mute); cursor: not-allowed; opacity: 1; }
td select { width: auto; min-width: 130px; }
.as select { width: auto; }
#asrole:not([hidden]) { display: contents; }
#gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: var(--bg); overflow: auto; }
#gate[hidden] { display: none; }
.gatebox { width: min(380px, 100%); padding: 36px 32px 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: center; }
.gatelogo { display: block; width: 54px; height: auto; margin: 0 auto 18px; }

.gatebox h1 { margin: 0 0 6px; font: 800 19px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .02em; text-transform: none; }

.gatebox form { text-align: left; }
.gatebox label { margin-bottom: 7px; font: 400 13px/1.3 Arial, sans-serif; letter-spacing: 0; text-transform: none; color: var(--mute); }
.gatebox input { width: 100%; min-height: 44px; margin-bottom: 12px; padding: 0 12px; border: 1px solid var(--fline); border-radius: 8px; background: var(--field); color: var(--text); font-size: 15px; }
.gatebox input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.gatelink { display: block; width: 100%; margin-top: 16px; padding: 4px; border: 0; background: none; color: var(--mute); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.gatelink:hover { color: var(--text); }
.gatenote:empty { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 2px solid #000; background: var(--yellow); color: #000; font: 800 11px/1 Unbounded, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; box-shadow: 3px 3px 0 var(--pink); white-space: nowrap; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pink); }
.btn.ghost { background: none; color: var(--text); border-color: var(--ghost); box-shadow: none; }
.btn.danger { background: none; color: var(--warn); border-color: var(--warnline); box-shadow: none; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, nav button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { padding: 16px; background: var(--panel); border: 1px solid var(--line); }
.stat b { display: block; font: 800 28px/1 Unbounded, Arial, sans-serif; margin-bottom: 8px; }
.stat span { font-size: 12px; color: var(--mute); }
.panel { margin-top: 18px; padding: 18px; background: var(--panel); border: 1px solid var(--line); }
.panel > h2 { margin-bottom: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.empty { padding: 26px 0; color: var(--mute); text-align: center; }
.tag { display: inline-block; padding: 3px 7px 4px; font: 700 9.5px/1 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; background: var(--chip); color: var(--text); white-space: nowrap; }
.tag.y { background: var(--yellow); color: #000; } .tag.p { background: var(--pink); color: #000; } .tag.b { background: var(--blue); color: #fff; } .tag.g { background: var(--green); color: #000; } .tag.o { background: none; border: 1px solid var(--ghost); color: var(--mute); }
/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); min-height: 220px; }
.col header { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.col header b { font: 800 10.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.col header i { font-style: normal; font-size: 12px; color: var(--mute); }
.col .drop { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 160px; max-height: calc(100vh - 250px); overflow-y: auto; }
.col.over { outline: 2px dashed var(--focus); outline-offset: -4px; }
.card { padding: 11px 11px 10px; background: var(--card); border: 1px solid var(--cline); border-left: 4px solid var(--yellow); cursor: pointer; text-align: left; width: 100%; }
.card[draggable=true] { cursor: grab; }
.card.mine { border-left-color: var(--pink); }
.card strong { display: block; font-size: 14px; line-height: 1.25; margin-bottom: 8px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11.5px; color: var(--mute); }
.card .late { color: var(--warn); font-weight: 700; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.bar > * { flex: 0 1 190px; }
.bar .grow { flex: 1 1 220px; }
.bar .btn { flex: none; }
/* calendar */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cal-head h2 { min-width: 190px; font-size: 15px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.cal .dow { padding: 7px 8px; font: 700 10px/1 Unbounded, Arial, sans-serif; color: var(--mute); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.day.out { background: var(--out); color: var(--dim); }
.day.today .n { background: var(--yellow); color: #000; }
.day .n { align-self: flex-start; padding: 1px 6px; font-size: 12px; font-weight: 700; }
.chip { display: block; width: 100%; padding: 4px 6px; border: 0; background: var(--yellow); color: #000; font-size: 11.5px; line-height: 1.2; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.dl { background: none; border: 1px dashed var(--ghost); color: var(--text); }
.chip.pub { background: var(--green); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--mute); }
/* table */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; padding: 9px 10px; font: 700 9.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } @media (hover: hover) { tr.click:hover td { background: var(--hover); } }
td .tag { margin: 1px 0; }
.perm td, .perm th { text-align: center; } .perm td:first-child, .perm th:first-child { text-align: left; }
.yes { color: var(--ok); font-weight: 700; } .no { color: var(--mute); } .part { color: var(--part); font-size: 12px; }
.invite { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
label { display: block; font: 700 9.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.mail { margin-top: 14px; padding: 14px; border: 1px dashed var(--ghost); font-size: 13.5px; white-space: pre-wrap; background: var(--field); }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { padding: 8px 12px; border: 1px solid var(--ghost); background: none; font: 700 10.5px/1 Unbounded, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--inv); color: var(--inv-text); border-color: var(--inv); }
.plan h2 { margin: 22px 0 8px; } .plan h2:first-child { margin-top: 0; } .plan p, .plan li { max-width: 72ch; } .plan ol, .plan ul { padding-left: 20px; margin: 6px 0; } .plan li { margin: 5px 0; }
dialog { width: min(620px, calc(100vw - 24px)); max-height: calc(100svh - 24px); padding: 0; border: 1px solid var(--dlgline); background: var(--dlg); color: var(--text); box-shadow: 8px 8px 0 var(--yellow); }
dialog::backdrop { background: rgb(0 0 0 / .75); }
.dlg { padding: 22px; overflow-y: auto; max-height: calc(100svh - 26px); }
.dlg h2 { font-size: 15px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .full { grid-column: 1 / -1; }
.dlg .actions { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin: 18px -22px -22px; padding: 12px 22px; background: var(--dlg); border-top: 1px solid var(--line); }
.dlg .actions > span { display: flex; flex-wrap: wrap; gap: 8px; }
.dlg h2 { padding-right: 34px; }
.dlgx { position: absolute; z-index: 3; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--dlg); color: var(--mute); font-size: 26px; line-height: 1; cursor: pointer; }
.dlgx:hover, .dlgx:focus-visible { color: var(--text); outline: 0; }
dialog { overflow: hidden; }
.note { font-size: 12.5px; color: var(--mute); margin-top: 10px; }
.toast { position: fixed; z-index: 70; left: 12px; right: 12px; bottom: 22px; width: fit-content; margin: 0 auto; padding: 11px 16px; cursor: pointer; background: var(--inv); color: var(--inv-text); font-weight: 700; font-size: 13.5px; box-shadow: 4px 4px 0 var(--pink); max-width: calc(100vw - 24px); }
.toast.bad { background: var(--pink); color: #000; box-shadow: 4px 4px 0 var(--inv); }

#edstatus.bad { color: var(--warn); font-weight: 700; }
#tabbar { display: none; }

  aside { position: static; height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .logo { margin: 0; } .logo span { display: none; }
  nav { flex-direction: row; } nav button { padding: 9px 10px; white-space: nowrap; gap: 6px; }
  aside .foot { display: none; }

  .day { min-height: 70px; padding: 3px; } .chip { font-size: 10px; padding: 3px; } .cal .dow { padding: 6px 3px; font-size: 8.5px; }
}
.nav-h { padding: 6px 12px; font: 700 9px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.nav-h:not(:first-child) { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }

.pcard .w { font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }

.ptable { margin-top: 0; padding: 0; }

.ptable .ava { width: 34px; height: 34px; font-size: 11px; }
.ptable td.pa { width: 46px; }

.ptable td.nw { white-space: nowrap; }
.ptable .tags { flex-wrap: nowrap; }
.sort { display: block; width: 100%; margin: -9px -10px; padding: 9px 10px; box-sizing: content-box; text-align: left; border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
.sort:hover, th[aria-sort] .sort { color: var(--text); }
.sort:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

.coladd { display: flex; gap: 8px; margin-top: 14px; } .coladd .btn { flex: none; }
.phrow { display: flex; align-items: center; gap: 14px; }
.notes { list-style: none; margin: 16px 0 0; padding: 0; }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.phead { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.phead .pi { flex: 1 1 240px; min-width: 0; }
.phead h2 { font-size: 20px; overflow-wrap: anywhere; }
.phead p { margin: 8px 0 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
.acc { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 6px; margin-bottom: 6px; }
.list li span { overflow-wrap: anywhere; min-width: 0; }
@media (max-width: 860px) {
  nav { align-items: center; }
  .nav-h, .nav-h:not(:first-child) { margin: 0; padding: 0 2px 0 10px; border: 0; border-left: 1px solid var(--line); white-space: nowrap; }

}

.tgl:hover { border-color: var(--text); }
.tgl:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.card .words { color: var(--mute); }

/* ---------- calm layer: quiet surfaces, sentence case, colour only where it means something ---------- */
:root { --bg: #111214; --panel: #17181b; --line: #25272b; --side: #0c0d0f; --field: #0e0f11; --fline: #44474d; --card: #1c1d21; --cline: #2b2d32; --hover: #1f2125; --chip: #2a2c31; --ghost: #4a4d54; --dlg: #17181b; --dlgline: #33363b; --out: #141518; --link: #f2f0ec; --focus: #d9d64a; --mark: #d9d64a;
  --y-soft: rgb(253 253 56 / .14); --y-ink: #eeea6a; --p-soft: rgb(255 61 139 / .16); --p-ink: #ff8db8; --g-soft: rgb(94 210 154 / .16); --g-ink: #7fdcae; --b-soft: rgb(77 99 255 / .2); --b-ink: #a3aeff; --r: 10px; }
:root[data-theme=light] { --link: #141414; --focus: #141414; --y-soft: #f4f0a8; --y-ink: #4a4300; --p-soft: #fbdce8; --p-ink: #99103f; --g-soft: #d5f0e2; --g-ink: #0d5d36; --b-soft: #dfe3ff; --b-ink: #1d2fb0; }
html, body { font-size: 15px; }
h1 { text-transform: none; letter-spacing: 0; font-size: 22px; }
h2, h3 { font-family: Arial, Helvetica, sans-serif; text-transform: none; letter-spacing: 0; }
h2 { font-size: 15.5px; font-weight: 700; } h3 { font-size: 13px; }
a { color: var(--link); text-decoration-color: var(--ghost); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
.logo .u { font-size: 12px; letter-spacing: .06em; }
nav button { padding: 9px 12px; border-radius: 8px; font: 500 14px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; }
nav button:hover { background: var(--hover); }
nav button[aria-current=page] { background: var(--hover); color: var(--text); font-weight: 700; box-shadow: inset 3px 0 0 var(--yellow); }
nav button i { font-size: 12px; opacity: .7; }
.nav-h { font: 600 11px/1.2 Arial, Helvetica, sans-serif; letter-spacing: .08em; }
.proto { background: var(--chip); color: var(--mute); font-weight: 400; }
.panel, .stat, .col { border-radius: var(--r); }
.stat b { font-size: 26px; }
.btn { min-height: 38px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px; box-shadow: none; font: 700 13.5px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; }
.btn:hover { filter: brightness(.95); }
.btn:active { transform: none; box-shadow: none; filter: brightness(.88); }
.btn.ghost { border-color: var(--ghost); } .btn.ghost:hover { background: var(--hover); filter: none; }
.btn.danger { border-color: var(--warnline); }
.tgl, .tabs button { border-radius: 8px; }
.tabs button { font: 600 13px/1 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; padding: 9px 14px; }
select, input[type=text], input[type=email], input[type=date], input[type=search], input[type=tel], input[type=password], textarea { border-radius: 8px; }
label, th { font: 600 12px/1.3 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; }
.tag { padding: 3px 8px; border-radius: 999px; font: 600 11.5px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; }
.tag.y { background: var(--y-soft); color: var(--y-ink); } .tag.p { background: var(--p-soft); color: var(--p-ink); } .tag.g { background: var(--g-soft); color: var(--g-ink); } .tag.b { background: var(--b-soft); color: var(--b-ink); }
.col header b { font: 700 13.5px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; }
.card { border-radius: 8px; border-left: 3px solid transparent; }
.card.mine { border-left-color: var(--yellow); }
.card:hover { border-color: var(--ghost); } .card.mine:hover { border-left-color: var(--yellow); }
.card strong { font-weight: 600; }
.ava { border-radius: 50%; background: var(--chip); color: var(--text); font: 700 12px/1 Arial, Helvetica, sans-serif; }
.chip { border-radius: 4px; background: var(--y-soft); color: var(--y-ink); }
.chip.pub { background: var(--g-soft); color: var(--g-ink); } .chip.dl { color: var(--mute); border-radius: 4px; }
.cal { border-radius: var(--r); overflow: hidden; } .cal .dow { font: 600 11px/1 Arial, Helvetica, sans-serif; }
.day.today .n { border-radius: 999px; }
dialog { border: 1px solid var(--dlgline); border-radius: 14px; box-shadow: 0 24px 70px rgb(0 0 0 / .55); }
.toast { border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); font-weight: 600; }
.toast.bad { background: var(--p-ink); color: #000; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
:root[data-theme=light] .toast.bad { color: #fff; }
.mail { border-radius: 8px; }
.tagadd { border-radius: 999px; }
.more > button[data-go] { font: 500 15px/1.2 Arial, Helvetica, sans-serif; letter-spacing: 0; text-transform: none; border-radius: 8px; border-top: 0; }
.more > button[aria-current=page] { background: var(--hover); color: var(--text); font-weight: 700; box-shadow: inset 3px 0 0 var(--yellow); }
.ed-tools { box-shadow: 0 8px 24px rgb(0 0 0 / .4); border-radius: 8px; overflow: hidden; }
.ed-ins, .ed-ask { box-shadow: 0 12px 34px rgb(0 0 0 / .45); border-radius: 10px; }
.gatebox h1 { font-size: 19px; }
@media (max-width: 860px) {
  h1 { font-size: 20px; }
  .btn { min-height: 44px; }
  #tabbar button { font: 600 11.5px/1.2 Arial, Helvetica, sans-serif; text-transform: none; }
  #tabbar button[aria-current=page] { background: none; color: var(--text); box-shadow: inset 0 2px 0 var(--yellow); }
  .ed-tools { border-radius: 0; }
  .dlg .actions > span:first-child .btn { border: 0; }
  dialog { border-radius: 14px; }
}

/* ---------- Mail: three panes ---------- */
.mx { display: grid; grid-template-columns: 216px minmax(250px, 340px) minmax(0, 1fr); height: calc(100vh - 140px); min-height: 440px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.mx.adm { grid-template-columns: 216px minmax(0, 1fr); }
.mx-side { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; border-right: 1px solid var(--line); overflow-y: auto; background: var(--side); }
.mx-side .btn { margin-bottom: 10px; }
.mx-side .nav-h { margin: 14px 8px 4px; color: var(--mute); }
.mx-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--mute); font: 500 14px/1.25 Arial, Helvetica, sans-serif; text-align: left; cursor: pointer; }
.mx-f span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mx-f:hover { background: var(--hover); }
.mx-f[aria-current=true] { background: var(--hover); color: var(--text); font-weight: 700; }
.mx-f i { font-style: normal; font-size: 12px; font-weight: 700; color: var(--text); background: var(--chip); border-radius: 999px; padding: 2px 7px; }
.mx-side .mx-set { margin-top: auto; padding-top: 12px; }
.mx-top { display: none; }
.mx-list { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.mx-q { padding: 10px; border-bottom: 1px solid var(--line); }
.mx-q input { width: 100%; }
.mx-rows { flex: 1; overflow-y: auto; padding: 4px 6px 12px; }
.mx-m { margin: 10px 8px 4px; font-size: 12px; font-weight: 600; color: var(--mute); }
.ml { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 6px; width: 100%; padding: 9px 10px 10px 6px; border: 0; border-radius: 8px; background: none; color: var(--mute); font: 400 13.5px/1.35 Arial, Helvetica, sans-serif; text-align: left; cursor: pointer; }
.ml:hover { background: var(--hover); }
.ml.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--yellow); }
.ml > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ml .dot { grid-row: 1; grid-column: 1; align-self: center; width: 7px; height: 7px; border-radius: 50%; }
.ml.unread .dot { background: var(--b-ink); }
.ml .w { grid-column: 2; color: var(--text); font-size: 14px; }
.ml .d { grid-column: 3; font-size: 12px; }
.ml .s, .ml .p, .ml .b { grid-column: 2 / -1; }
.ml .s { color: var(--text); }
.ml.unread .w, .ml.unread .s { font-weight: 700; }
.ml .b { font-size: 11.5px; }
.mx-read { min-width: 0; overflow-y: auto; padding: 14px 22px 26px; }
.mx-bar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
.mx-bar .back { display: none; margin-right: auto; }
.mx-read h2 { margin: 0 0 8px; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
.mx-read .mailhead { margin: 0 0 16px; }
.mx-none { display: grid; place-items: center; height: 100%; color: var(--mute); text-align: center; }

  // ---------- project board and contacts (MAIN and C-Level only) ----------

  // Import a prepared list: only known fields are taken, links must be http(s), people already in the list are skipped.

      + '<div class="tabs" role="tablist" style="flex-wrap:wrap">' + BSEC.map(function (b) { return '<button type="button" role="tab" data-betasec="' + b[0] + '" aria-selected="' + (beta.sec === b[0]) + '">' + b[1] + ' · ' + nfmt(count(b[0])) + '</button>'; }).join('') + '</div>'
      + (hot.length ? '<div class="bhot"><span>Имена и названия, которые за два дня встретились у нескольких изданий:</span>' + hot.map(function (h) { return '<button type="button" data-betaq="' + esc(h.key) + '" aria-pressed="' + (beta.q.toLowerCase() === h.key) + '" title="Изданий и каналов: ' + h.src + '">' + esc(h.form) + '<i>' + h.src + '</i></button>'; }).join('') + '</div>' : '')
      + '<div class="panel" style="margin-top:0"><div id="betalist">' + betaList() + '</div></div>'
      + '<p class="note"><span id="betaprog">' + esc(beta.prog) + '</span>' + (beta.prog ? ' ' : '') + (last ? 'Источники обновлялись ' + esc(bago(last)) + '. ' : '') + 'Лента хранится две недели. Здесь только открытые ленты: издания, тренды поиска Google и Википедии по странам, публичные Telegram-каналы, темы Bluesky, Hacker News. «Наши контакты» — это Telegram-каналы, YouTube и сайты из анкет в «Контактах». Instagram, TikTok, X и комментарии под постами не подключены: у них нет открытой ленты. Раздел видит только MAIN.</p>';
  }
  function betaSources() {
    var rowsHtml = function () {
      return beta.sources.length ? beta.sources.slice().sort(function (a, b) { return a.section < b.section ? -1 : a.section > b.section ? 1 : a.title.localeCompare(b.title, 'ru'); }).map(function (x) {
        var sec = BSEC.filter(function (b) { return b[0] === x.section; })[0];
        return '<li><input type="checkbox" data-bon="' + x.id + '" aria-label="Включён"' + (x.on_ ? ' checked' : '') + '><span>' + esc(x.title) + '</span><button type="button" data-bdel="' + x.id + '">Убрать</button>'
          + '<small' + (x.err ? ' class="bad"' : '') + '>' + esc((sec ? sec[1] : '') + (x.tag ? ', ' + x.tag : '')) + ' · ' + (x.err ? 'ошибка: ' + esc(x.err) : x.pulled_at ? 'записей в последний раз: ' + x.last_n : 'ещё не обновлялся') + '</small></li>';
      }).join('') : '<li><span></span><span>Источников нет.</span></li>';
    };
    dlgbody.innerHTML = '<h2>Источники</h2><ul class="bsrc" id="bsrclist">' + rowsHtml() + '</ul>'
      + '<form id="bsrcform"><h3>Добавить</h3><div class="grid2"><div class="full"><label for="bk">Что это</label><select id="bk" name="kind">' + Object.keys(BKIND).map(function (k) { return '<option value="' + k + '">' + BKIND[k] + '</option>'; }).join('') + '</select></div>'
      + '<div><label for="bt">Название</label><input id="bt" name="title" type="text" required maxlength="80"></div><div><label for="bg">Язык или страна</label><input id="bg" name="tag" type="text" maxlength="40" placeholder="на русском"></div>'
      + '<div class="full"><label for="bu">Адрес ленты, имя канала или код</label><input id="bu" name="url" type="text" required maxlength="500"></div></div>'
      + '<div class="actions"><button type="button" class="btn ghost" id="bsrcclose">Закрыть</button><button type="submit" class="btn">Добавить и проверить</button></div></form>';
    if (!dlg.open) dlg.showModal();
    var list = document.getElementById('bsrclist'), f = document.getElementById('bsrcform');
    document.getElementById('bsrcclose').onclick = function () { dlg.close(); render(); };
    list.onchange = async function (e) {
      var id = e.target.dataset.bon; if (!id) return;
      var r = await sb.from('beta_sources').update({ on_: e.target.checked }).eq('id', id);
      if (r.error) return toast('Не получилось: ' + cloudWhy(r.error));
      bsrc(id).on_ = e.target.checked;
    };
    list.onclick = async function (e) {
      var id = e.target.dataset.bdel, x = id && bsrc(id); if (!x) return;
      if (!confirm('Убрать источник «' + x.title + '»? Его записи исчезнут из ленты.')) return;
      var r = await sb.from('beta_sources').delete().eq('id', id);
      if (r.error) return toast('Не получилось: ' + cloudWhy(r.error));
      beta.sources = beta.sources.filter(function (y) { return y.id !== id; }); beta.items = beta.items.filter(function (y) { return y.source !== id; });
      list.innerHTML = rowsHtml();
    };
    f.onsubmit = async function (e) {
      e.preventDefault();
      var kind = f.kind.value, url = f.url.value.trim(), btn = f.querySelector('button[type=submit]');
      if (kind === 'telegram') url = url.replace(/^https?:\/\/t\.me\/(s\/)?/i, '').replace(/^@/, '').replace(/\/$/, '');
      btn.disabled = true; btn.textContent = 'Проверяем…';
      var r = await sb.from('beta_sources').insert({ kind: kind, section: BSECOF[kind], title: f.title.value.trim(), url: url, tag: f.tag.value.trim() }).select().single();
      if (r.error) { btn.disabled = false; btn.textContent = 'Добавить и проверить'; return toast(r.error.code === '23505' ? 'Такой источник уже есть' : 'Не получилось: ' + cloudWhy(r.error)); }
      var t = await sb.functions.invoke('beta-pull', { body: { sources: [r.data.id] } });
      var res = !t.error && t.data && t.data.results[0];
      btn.disabled = false; btn.textContent = 'Добавить и проверить';
      if (!res || res.err) { await sb.from('beta_sources').delete().eq('id', r.data.id); return toast('Источник не добавлен: ' + (res ? res.err : 'сервер не ответил')); }
      r.data.pulled_at = new Date().toISOString(); r.data.last_n = res.n; beta.sources.push(r.data);
      f.reset(); list.innerHTML = rowsHtml(); toast('Добавлено, записей: ' + res.n); beta.at = 0;
    };
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-betapull],[data-betasrc],[data-betasec],[data-betaq],[data-betaidea],[data-betamore]'); if (!t) return;
    if ('betapull' in t.dataset) { if (!sb) return toast('Обновление работает на auf.media'); if (beta.busy) return toast('Уже обновляем'); betaPull(); betaProg('Обновляем источники…'); return; }
    if ('betasrc' in t.dataset) { if (!sb) return toast('Источники настраиваются на auf.media'); return betaSources(); }
    if ('betamore' in t.dataset) { beta.lim += 150; return render(); }
    if (t.dataset.betasec) { beta.sec = t.dataset.betasec; beta.lim = 150; return render(); }
    if (t.dataset.betaq) { beta.q = beta.q.toLowerCase() === t.dataset.betaq ? '' : t.dataset.betaq; beta.lim = 150; return render(); }
    if (t.dataset.betaidea) {
      var it = beta.items.filter(function (x) { return x.id === t.dataset.betaidea; })[0]; if (!it) return;
      openCard(null, { title: it.title.slice(0, 160), notes: 'Откуда идея: ' + bname(it) + (bweb(it.url) ? '\n' + it.url : '') });
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id !== 'betaq') return; beta.q = e.target.value; beta.lim = 150; var el = document.getElementById('betalist'); if (el) el.innerHTML = betaList(); });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'betadays') { beta.days = +e.target.value; beta.lim = 150; render(); }
    if (e.target.id === 'betatag') { beta.tag = e.target.value; beta.lim = 150; render(); }
  });
  var audit = [], auditAt = 0, auditErr = '', auditBusy = false, AUDITMAX = 300;
  function when(v) { var d = new Date(v); if (isNaN(d)) return ''; var day = iso(d) === TODAY ? 'сегодня' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); return day + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
  async function auditLoad() {
    if (auditBusy || !sb) return; auditBusy = true;
    var r = await sb.from('audit').select('*').order('at', { ascending: false }).limit(AUDITMAX);
    auditBusy = false; auditAt = Date.now();
    if (r.error) auditErr = /audit/.test(String(r.error.message)) && /find the table|does not exist|schema cache/.test(String(r.error.message)) ? 'Журнал ещё не включён: запустите файл auf-supabase-4.sql в Supabase.' : 'Не получилось загрузить журнал: ' + cloudWhy(r.error);
    else { auditErr = ''; audit = r.data || []; }
    if (state.view === 'log' && !busy()) render();
  }
  function cloudSeen() { if (sb && cloudUser && synced && !document.hidden) sb.rpc('touch_seen').then(function () {}, function () {}); }
  setInterval(cloudSeen, 5 * 60 * 1000);
  function cloudLogout() { cloudStop(); synced = null; cloudUser = null; sb.auth.signOut({ scope: 'local' }).catch(function () {}); gateShow('login'); }
  function cloudBoot() {
    var bad = /error_description=([^&]+)/.exec(location.hash), hadLink = /access_token=|error=/.test(location.hash);
    sb = supabase.createClient(CLOUD.url, CLOUD.key);
    gateShow('wait');
    sb.auth.onAuthStateChange(function (ev, session) {
      setTimeout(function () {
        if (!session) {
          if (cloudUser) { cloudStop(); cloudUser = null; synced = null; }
          var why = bad ? 'Ссылка из письма уже использована или устарела. Запросите новую: «Первый вход» ниже.' : '';
          bad = null; if (hadLink) { hadLink = false; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
          return gateShow('login', why);
        }
        sb.realtime.setAuth(session.access_token);
        if (cloudUser && cloudUser.id === session.user.id) return;
        cloudUser = session.user; claimed = false; synced = null;
        needPw = hadLink || !(session.user.user_metadata && session.user.user_metadata.pw); hadLink = false;
        cloudPull(true).then(function () { if (synced && !rtDb) cloudListen(); });
      }, 0);
    });
  }
  // Copy made in the browser prototype → shared database. Adds what is missing, never overwrites.
  function importCopy() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var file = inp.files[0]; if (!file) return;
      file.text().then(function (text) {
        var s; try { s = JSON.parse(text); } catch (e) { return toast('Это не файл копии: не читается как JSON'); }
        if (!s || s.v !== 1 || !Array.isArray(s.cards)) return toast('Это не копия админки AUF');
        var who = function (id) { return id === s.me ? state.me : (member(id) ? id : ''); }, n = 0;
        var have = function (list) { var o = {}; list.forEach(function (x) { o[x.id] = 1; }); return o; };
        var hc = have(state.cards), ht = have(state.tasks), hp = have(state.contacts), hx = have(state.pcols), names = {};
        state.contacts.forEach(function (p) { names[String(p.name).toLowerCase()] = 1; });
        s.cards.slice().reverse().forEach(function (c) { if (!c || !c.id || hc[c.id]) return; delete c._at; c.author = who(c.author) || state.me; c.editor = who(c.editor); state.cards.unshift(c); n++; });
        (s.tasks || []).slice().reverse().forEach(function (t) { if (!t || !t.id || ht[t.id]) return; delete t._at; t.who = who(t.who); state.tasks.unshift(t); n++; });
        (s.contacts || []).forEach(function (p) { if (!p || !p.id || hp[p.id] || names[String(p.name).toLowerCase()]) return; delete p._at; p.by = who(p.by) || state.me; if (!Array.isArray(p.log)) p.log = []; state.contacts.push(p); n++; });
        (s.pcols || []).forEach(function (c) { if (c && c.id && !hx[c.id]) state.pcols.push(c); });
        fixTags(); save(); render();
        toast(n ? 'Перенесено записей: ' + n : 'Новых записей в файле нет');
      });
    };
    inp.click();
  }

  document.addEventListener('click', function (e) {
    if (!cloudOn || !e.target.closest) return;
    if (e.target.closest('[data-logrefresh]')) { auditAt = 0; return auditLoad(); }
    var q = function (k) { return e.target.closest('[' + k + ']'); }, x;
    var rs = e.target.closest('[data-resend]'); if (rs && cloudRole === 'owner') return cloudResend(rs.dataset.resend);
    if (e.target.closest('[data-logout]')) { if (gate.hidden && !confirm('Выйти из редакции на этом устройстве?')) return; return cloudLogout(); }
    if (e.target.closest('[data-importcopy]') && cloudRole === 'owner') importCopy();
  });
  render();
  if (cloudOn) { document.getElementById('proto').hidden = true; document.getElementById('logout').hidden = false; document.querySelector('aside .foot').textContent = 'AUF MEDIA · редакция'; cloudBoot(); }
})();
</script>
