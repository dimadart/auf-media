<title>AUF MEDIA — редакция</title>
<style>
@font-face { font-family: Unbounded; font-weight: 300 900; font-display: swap; src: url(../assets/editorial/fonts/unbounded-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Unbounded; font-weight: 300 900; font-display: swap; src: url(../assets/editorial/fonts/unbounded-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2191, U+2193; }
:root { --bg: #0b0b0b; --panel: #151515; --line: #2c2c2c; --text: #f2f0ec; --mute: #9b9792; --yellow: #fdfd38; --pink: #ff3d8b; --blue: #4d63ff; --green: #5ed29a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, .u { font-family: Unbounded, 'Arial Black', Arial, sans-serif; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
h1 { font-size: 20px; font-weight: 800; }
h2 { font-size: 13px; font-weight: 800; }
h3 { font-size: 11px; font-weight: 700; color: var(--mute); }
a { color: var(--yellow); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: #000; }

.logo img { width: 34px; height: auto; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 12px; border: 0; background: none; text-align: left; font: 700 11px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); cursor: pointer; }
nav button:hover { color: var(--text); }
nav button[aria-current=page] { background: var(--yellow); color: #000; }
nav button i { font-style: normal; font-size: 10px; opacity: .8; }
aside .foot { margin-top: auto; font-size: 12px; color: var(--mute); padding: 0 6px; }
main { min-width: 0; padding: 0 26px 60px; }
.proto { margin: 0 -26px; padding: 8px 26px; background: var(--pink); color: #fff; font-size: 12.5px; font-weight: 700; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 20px 0 18px; }
.as { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
select, input[type=text], input[type=email], input[type=date], input[type=search], textarea { width: 100%; padding: 9px 10px; border: 1px solid #444; border-radius: 0; background: #000; color: var(--text); outline: 0; }
select:focus-visible, input:focus-visible, textarea:focus-visible { border-color: var(--yellow); }
.as select { width: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 2px solid #000; background: var(--yellow); color: #000; font: 800 11px/1 Unbounded, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; box-shadow: 3px 3px 0 var(--pink); white-space: nowrap; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pink); }
.btn.ghost { background: none; color: var(--text); border-color: #555; box-shadow: none; }
.btn.danger { background: none; color: #ff7aa9; border-color: #6b2a44; box-shadow: none; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, nav button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { padding: 16px; background: var(--panel); border: 1px solid var(--line); }
.stat b { display: block; font: 800 28px/1 Unbounded, Arial, sans-serif; margin-bottom: 8px; }
.stat span { font-size: 12px; color: var(--mute); }
.panel { margin-top: 18px; padding: 18px; background: var(--panel); border: 1px solid var(--line); }
.panel > h2 { margin-bottom: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.empty { padding: 26px 0; color: var(--mute); text-align: center; }
.tag { display: inline-block; padding: 3px 7px 4px; font: 700 9.5px/1 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; background: #2a2a2a; color: var(--text); white-space: nowrap; }
.tag.y { background: var(--yellow); color: #000; } .tag.p { background: var(--pink); color: #fff; } .tag.b { background: var(--blue); color: #fff; } .tag.g { background: var(--green); color: #000; } .tag.o { background: none; border: 1px solid #666; color: var(--mute); }
/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); min-height: 220px; }
.col header { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.col header b { font: 800 10.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.col header i { font-style: normal; font-size: 12px; color: var(--mute); }
.col .drop { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 160px; }
.col.over { outline: 2px dashed var(--yellow); outline-offset: -4px; }
.card { padding: 11px 11px 10px; background: #000; border: 1px solid #333; border-left: 4px solid var(--yellow); cursor: pointer; text-align: left; width: 100%; }
.card[draggable=true] { cursor: grab; }
.card.mine { border-left-color: var(--pink); }
.card strong { display: block; font-size: 14px; line-height: 1.25; margin-bottom: 8px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11.5px; color: var(--mute); }
.card .late { color: #ff7aa9; font-weight: 700; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.bar > * { flex: 0 1 190px; }
.bar .grow { flex: 1 1 220px; }
.bar .btn { flex: none; }

.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cal-head h2 { min-width: 190px; font-size: 15px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.cal .dow { padding: 7px 8px; font: 700 10px/1 Unbounded, Arial, sans-serif; color: var(--mute); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.day.out { background: #0e0e0e; color: #555; }
.day.today .n { background: var(--yellow); color: #000; }
.day .n { align-self: flex-start; padding: 1px 6px; font-size: 12px; font-weight: 700; }
.chip { display: block; width: 100%; padding: 4px 6px; border: 0; background: var(--yellow); color: #000; font-size: 11.5px; line-height: 1.2; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.dl { background: none; border: 1px dashed #777; color: var(--text); }
.chip.pub { background: var(--green); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--mute); }
/* table */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; padding: 9px 10px; font: 700 9.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: #1c1c1c; }
td .tag { margin: 1px 0; }
.perm td, .perm th { text-align: center; } .perm td:first-child, .perm th:first-child { text-align: left; }
.yes { color: var(--green); font-weight: 700; } .no { color: #555; } .part { color: var(--yellow); font-size: 12px; }
.invite { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
label { display: block; font: 700 9.5px/1.2 Unbounded, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.mail { margin-top: 14px; padding: 14px; border: 1px dashed #555; font-size: 13.5px; white-space: pre-wrap; background: #000; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { padding: 8px 12px; border: 1px solid #555; background: none; font: 700 10.5px/1 Unbounded, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.tabs button[aria-selected=true] { background: #fff; color: #000; border-color: #fff; }
.plan h2 { margin: 22px 0 8px; } .plan h2:first-child { margin-top: 0; } .plan p, .plan li { max-width: 72ch; } .plan ol, .plan ul { padding-left: 20px; margin: 6px 0; } .plan li { margin: 5px 0; }
dialog { width: min(620px, calc(100vw - 24px)); max-height: calc(100svh - 24px); padding: 0; border: 1px solid #666; background: #101010; color: var(--text); box-shadow: 8px 8px 0 var(--yellow); }
dialog::backdrop { background: rgb(0 0 0 / .75); }
.dlg { padding: 22px; overflow-y: auto; max-height: calc(100svh - 26px); }
.dlg h2 { font-size: 15px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .full { grid-column: 1 / -1; }
.dlg .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 18px; }
.note { font-size: 12.5px; color: var(--mute); margin-top: 10px; }
.toast { position: fixed; z-index: 20; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 11px 16px; background: #fff; color: #000; font-weight: 700; font-size: 13.5px; box-shadow: 4px 4px 0 var(--pink); max-width: calc(100vw - 24px); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .logo { margin: 0; } .logo span { display: none; }
  nav { flex-direction: row; } nav button { padding: 9px 10px; white-space: nowrap; gap: 6px; }
  aside .foot { display: none; }
  main { padding: 0 14px 50px; } .proto { margin: 0 -14px; padding: 8px 14px; }
  .invite, .grid2 { grid-template-columns: 1fr; }
  .day { min-height: 70px; padding: 3px; } .chip { font-size: 10px; padding: 3px; } .cal .dow { padding: 6px 3px; font-size: 8.5px; }
}
</style>
</head>

</div>

    if (t.dataset.card) { event.preventDefault(); return openCard(t.dataset.card); }
    if ('new' in t.dataset) return openCard(null);
    if (t.dataset.month !== undefined) {
      if (t.dataset.month === '0') state.month = TODAY.slice(0, 7);
      else { var d = new Date(+state.month.slice(0, 4), +state.month.slice(5) - 1 + +t.dataset.month, 1); state.month = iso(d).slice(0, 7); }
      save(); return render();
    }
    if (t.dataset.day) return openCard(null, atLeast('editor') ? { publish: t.dataset.day, stage: 'idea' } : { deadline: t.dataset.day });
    if (t.dataset.kick) { var m = member(t.dataset.kick); if (m && confirm('Убрать ' + m.name + ' из команды?')) { state.team = state.team.filter(function (x) { return x.id !== m.id; }); save(); render(); toast('Убрали из команды'); } return; }
    if (t.dataset.tab) { inboxTab = t.dataset.tab; return render(); }
    if ('export' in t.dataset) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })); a.download = 'auf-admin-' + TODAY + '.json'; a.click(); return; }
    if ('reset' in t.dataset) { if (confirm('Сбросить прототип к начальному состоянию? Все ваши изменения в этом браузере пропадут.')) { state = fresh(); lastInvite = null; save(); render(); toast('Прототип сброшен'); } }
  });
  document.addEventListener('input', function (event) { var f = event.target.dataset && event.target.dataset.f; if (f) { filters[f] = event.target.value; render(); } });
  document.addEventListener('change', function (event) {
    var id = event.target.dataset && event.target.dataset.role;
    if (id) { var m = member(id); if (m) { m.role = event.target.value; save(); render(); toast('Роль изменена'); } }
  });
  document.addEventListener('submit', function (event) {
    if (event.target.id !== 'invite') return;
    event.preventDefault();
    var f = event.target, email = f.email.value.trim().toLowerCase(), name = f.name.value.trim();
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast('Проверьте имя и адрес почты'); return; }
    if (state.team.some(function (m) { return m.email === email; })) { toast('Этот адрес уже в команде'); return; }
    state.team.push({ id: uid(), name: name, email: email, role: f.role.value, status: 'invited' });
    lastInvite = { name: name, email: email, role: ROLES.filter(function (r) { return r.id === f.role.value; })[0].name };
    save(); render(); toast('Добавлено в команду. Письмо в прототипе не отправляется');
  });
  // drag and drop between columns
  var dragging = null;
  document.addEventListener('dragstart', function (event) { var c = event.target.closest && event.target.closest('.card'); if (c) { dragging = c.dataset.card; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', dragging); } });
  document.addEventListener('dragover', function (event) { var col = event.target.closest && event.target.closest('.col'); if (col && dragging) { event.preventDefault(); col.classList.add('over'); } });
  document.addEventListener('dragleave', function (event) { var col = event.target.closest && event.target.closest('.col'); if (col && !col.contains(event.relatedTarget)) col.classList.remove('over'); });
  document.addEventListener('drop', function (event) {
    var col = event.target.closest && event.target.closest('.col'); if (!col || !dragging) return;
    event.preventDefault();
    var c = state.cards.filter(function (x) { return x.id === dragging; })[0], to = col.dataset.stage; dragging = null;
    if (!c || c.stage === to) return render();
    if (!canMove(c, to)) { render(); return toast('В этой роли сюда двигать нельзя: дальше «На редактуре» материал ведёт редактор'); }
    c.stage = to; if (to === 'published' && !c.publish) c.publish = TODAY;
    save(); render(); toast('Перенесено: ' + STAGES[stageIx(to)].name);
  });
  document.addEventListener('dragend', function () { dragging = null; });
  dlg.addEventListener('click', function (event) { if (event.target === dlg) dlg.close(); });
  render();
})();
</script>
</body>
</html>
